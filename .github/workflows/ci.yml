name: Enterprise CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Standards, Architecture & Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Complete Quality Gate (Type-Check, Lint, Depcruise, Knip, Magic Strings, Production Audit, Duplication)
        run: npm run check

  unit-and-integration-tests:
    name: Vitest Unit- & Integration Tests (100% Isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite mit Coverage-Schwellen
        run: npm run test:coverage

  build-validation:
    name: Next.js Production Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  quality-e2e:
    name: Layoutstabilität & Barrierefreiheit (Produktionsbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Supabase starten und Abhängigkeiten installieren (parallel)
        run: |
          supabase start -x studio,edge-runtime,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta,realtime &
          supabase_pid=$!
          npm ci &
          npm_pid=$!
          supabase_status=0
          npm_status=0
          wait "$supabase_pid" || supabase_status=$?
          wait "$npm_pid" || npm_status=$?
          test "$supabase_status" -eq 0 && test "$npm_status" -eq 0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: CLS- und axe-Gate
        run: npm run test:quality
        env:
          NEXT_TELEMETRY_DISABLED: 1

  dependency-audit:
    name: Abhängigkeiten auf bekannte Schwachstellen prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: npm audit (Produktionsabhängigkeiten, ab Stufe high)
        run: npm audit --omit=dev --audit-level=high

  semgrep-sast:
    name: Semgrep Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep (festgelegte Version)
        run: pip install semgrep==1.170.0

      - name: Run Semgrep Security Rules
        run: npm run audit:sast

  supabase-migration-and-rls-check:
    name: Supabase Docker Migration & Determinism Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Supabase starten und Abhängigkeiten installieren (parallel)
        run: |
          supabase start -x studio,edge-runtime,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta,realtime &
          supabase_pid=$!
          npm ci &
          npm_pid=$!
          supabase_status=0
          npm_status=0
          wait "$supabase_pid" || supabase_status=$?
          wait "$npm_pid" || npm_status=$?
          test "$supabase_status" -eq 0 && test "$npm_status" -eq 0

      - name: Verify Clean Migration Run & Reset
        run: supabase db reset

      - name: Lint Database Schema & Security
        run: supabase db lint

      - name: Tenant Isolation Tests (RLS gegen echtes Postgres)
        run: npm run test:db
